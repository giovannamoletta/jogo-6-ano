<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aura 67 – Jogo de Matemática</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <header class="topo">
      <h1>Aura <span class="n67">67</span></h1>
      <p class="sub">Matemática do 6º ano: acerte e encha seu medidor de aura!</p>
    </header>

    <!-- Tela inicial -->
    <section id="tela-inicio" class="tela ativa">
      <p class="explica">São 10 perguntas. Cada acerto vale <strong>+67 de aura</strong>. Acertos seguidos dão bônus. Errou? Perde um pouco de aura.</p>
      <button id="btn-iniciar" class="btn">Começar</button>
    </section>

    <!-- Tela do jogo -->
    <section id="tela-jogo" class="tela">
      <div class="placar" aria-live="polite">
        <span>Pergunta <b id="num">1</b>/10</span>
        <span>Sequência: <b id="seq">0</b></span>
        <span>Aura: <b id="pontos">0</b></span>
      </div>
      <div class="medidor" role="progressbar" aria-label="Medidor de aura" aria-valuemin="0" aria-valuemax="670">
        <div id="barra"></div>
      </div>
      <h2 id="pergunta" class="pergunta"></h2>
      <div id="opcoes" class="opcoes"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <button id="btn-prox" class="btn" hidden>Próxima</button>
    </section>

    <!-- Tela final -->
    <section id="tela-fim" class="tela">
      <h2 id="rank"></h2>
      <p class="final">Aura final: <b id="aura-final">0</b></p>
      <p id="msg-final"></p>
      <button id="btn-reiniciar" class="btn">Jogar de novo</button>
    </section>
  </main>

  <div id="pop" class="pop" aria-hidden="true">SIX SEVEN!</div>
  <script src="script.js"></script>
</body>
</html>
