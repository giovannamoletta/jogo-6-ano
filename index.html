<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio Matemático: Missão 67</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="game-header">
    <h1>🧩 Desafio dos Números: Missão 67</h1>
  </header>

  <main class="game-container">
    <!-- Tela Inicial -->
    <section id="start-screen" class="screen active">
      <h2>Bem-vindo ao Desafio Matemático!</h2>
      <p>Encontre as combinações e cálculos corretos para atingir o número 67!</p>
      <button id="start-btn" class="btn-primary">Iniciar Jogo 🚀</button>
    </section>

    <!-- Tela do Jogo -->
    <section id="game-screen" class="screen hidden">
      <div class="hud">
        <span id="score">Pontos: 0</span>
        <span id="lives">Vidas: ❤️❤️❤️</span>
      </div>
      <div class="question-box">
        <h3 id="question-text">Qual expressão tem como resultado o número 67?</h3>
      </div>
      <div id="options-container" class="options-grid"></div>
    </section>

    <!-- Tela Final -->
    <section id="end-screen" class="screen hidden">
      <h2 id="final-title">Parabéns!</h2>
      <p id="final-score">Sua pontuação final foi: 0</p>
      <button id="restart-btn" class="btn-primary">Jogar Novamente 🔄</button>
    </section>
  </main>

  <footer class="game-footer">
    <p>Projeto Integrador Front-End • Matemática 6º Ano</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
